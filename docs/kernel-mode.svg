<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Angle snapping in Kinetic's engine versus in the Raw Accel driver</title>
<desc>Two rows show the path of mouse movement. In the first, the Kinetic app changes and re-sends the movement, and the anti-cheat drops it, so the game gets nothing. In the second, the Raw Accel driver changes the movement before Windows sees it, so the anti-cheat sees a normal mouse. A third row shows that the snapping result is the same.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="469" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>

<text x="40" y="38" font-size="15" font-weight="600" fill="#2C2C2A">Kinetic's own engine (app level)</text>
<g><rect x="40" y="52" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="105" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Mouse</text><text x="105" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">raw movement</text></g>
<line x1="170" y1="84" x2="194" y2="84" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="196" y="52" width="130" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="261" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Kinetic app</text><text x="261" y="98" text-anchor="middle" font-size="12" fill="#993C1D">snaps, re-sends</text></g>
<line x1="326" y1="84" x2="350" y2="84" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="352" y="52" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="417" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Anti-cheat</text><text x="417" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">drops injected</text></g>
<line x1="482" y1="84" x2="506" y2="84" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<g><rect x="508" y="52" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/><text x="573" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Game</text><text x="573" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">pointer frozen</text></g>

<text x="40" y="168" font-size="15" font-weight="600" fill="#2C2C2A">Kernel mode (Raw Accel driver)</text>
<g><rect x="40" y="182" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="105" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Mouse</text><text x="105" y="228" text-anchor="middle" font-size="12" fill="#5F5E5A">raw movement</text></g>
<line x1="170" y1="214" x2="194" y2="214" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="196" y="182" width="130" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="261" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Raw Accel</text><text x="261" y="228" text-anchor="middle" font-size="12" fill="#0F6E56">snaps in driver</text></g>
<line x1="326" y1="214" x2="350" y2="214" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="352" y="182" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="417" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Anti-cheat</text><text x="417" y="228" text-anchor="middle" font-size="12" fill="#5F5E5A">sees a mouse</text></g>
<line x1="482" y1="214" x2="506" y2="214" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<g><rect x="508" y="182" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="573" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Game</text><text x="573" y="228" text-anchor="middle" font-size="12" fill="#5F5E5A">straight line</text></g>

<text x="40" y="298" font-size="15" font-weight="600" fill="#2C2C2A">What angle snapping does</text>
<rect x="40" y="312" width="260" height="90" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<polyline fill="none" stroke="#D85A30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="60,362 90,352 120,368 150,350 180,366 210,352 240,364 280,356"/>
<text x="170" y="392" text-anchor="middle" font-size="12" fill="#5F5E5A">Your hand wobbles</text>
<line x1="304" y1="357" x2="336" y2="357" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340" y="312" width="300" height="90" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<line x1="364" y1="357" x2="616" y2="357" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round"/>
<text x="490" y="392" text-anchor="middle" font-size="12" fill="#5F5E5A">Pointer moves straight</text>

<text x="340" y="442" text-anchor="middle" font-size="12" fill="#5F5E5A">Same result either way. What differs is where it runs.</text>
</svg>
